<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AnemiaScan">
  <title>AnemiaScan</title>
  <!-- The AnemiaScan mark: one almond aperture, one iris, one scanning beam.
       Same geometry as src/components/app-logo.tsx, scaled 48 -> 180 (x3.75),
       with literal colours because a favicon cannot read CSS custom properties.
       The plate inverts with the OS palette so the teal mark keeps its contrast
       in both light and dark browser chrome. -->
  <style>
    .plate { fill: #07090f; }
    @media (prefers-color-scheme: light) {
      .plate { fill: #0f1420; }
    }
  </style>

  <defs>
    <linearGradient id="as-rim" x1="19" y1="30" x2="161" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2fd8b6" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </linearGradient>
    <radialGradient id="as-iris" cx="0.36" cy="0.3" r="0.85">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#2fd8b6" />
    </radialGradient>
    <linearGradient id="as-beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2fd8b6" stop-opacity="0" />
      <stop offset="42%" stop-color="#7dd3fc" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#2fd8b6" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect class="plate" width="180" height="180" rx="40" />

  <!-- lower-lid aperture -->
  <path
    d="M15.8 90C37.9 56.6 63 40.1 90 40.1S142.1 56.6 164.3 90C142.1 123.4 117 139.9 90 139.9S37.9 123.4 15.8 90Z"
    fill="none"
    stroke="url(#as-rim)"
    stroke-width="12"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- iris + pupil, punched through with the plate colour so it reads at 16px -->
  <circle cx="90" cy="90" r="28.5" fill="url(#as-iris)" />
  <circle class="plate" cx="90" cy="90" r="11.6" />
  <circle class="plate" cx="100.9" cy="78.4" r="4.3" opacity="0.7" />

  <!-- scanning beam, fading at both ends so it never reads as a crop mark -->
  <path d="M24.4 58.5H155.6" stroke="url(#as-beam)" stroke-width="9" stroke-linecap="round" />
</svg>
